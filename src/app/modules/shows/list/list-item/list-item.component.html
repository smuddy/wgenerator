@if (show) {
<div class="list-item">
  <div>{{ show.date.toDate() | date: "dd.MM.yyyy" }}</div>
  <div>
    <app-user-name [userId]="show.owner"></app-user-name>
  </div>
  <div>{{ show.showType | showType }}</div>
  <div>
    @if (showStatusBadge) {
    <app-badge [type]="showStatusBadgeType">{{ showStatusBadge }}</app-badge>
    }
  </div>
</div>
}
