name: Angular Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: runner
    container:
      image: node:20-bullseye

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci -f

      - name: Build Angular
        run: npm run build
